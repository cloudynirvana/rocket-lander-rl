[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lander"
version = "1.0.0"
description = "Reward shaping, reward hacking and robustness for reinforcement-learning rocket landing"
requires-python = ">=3.10"
dependencies = ["gymnasium[box2d]>=1.0", "stable-baselines3>=2.3", "matplotlib>=3.8", "imageio>=2.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
